<style>
  /* ── Grid ── */
  .photo-grid {
    columns: 3 280px;
    column-gap: 1rem;
    margin: 0 auto;
  }

  .photo-item {
    break-inside: avoid;
    margin-bottom: 1rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .photo-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.25s ease;
  }

  .photo-item:hover img {
    opacity: 0.88;
  }

  .photo-item:hover .photo-hover {
    opacity: 1;
  }

  .photo-hover {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0.6rem 0.75rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
    color: #fff;
    font-family: Georgia, serif;
    font-size: 0.8rem;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.25s ease;
    line-height: 1.4;
  }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: min(90vw, 900px);
    max-height: 90vh;
  }

  .lightbox-img {
    max-width: 100%;
    max-height: 72vh;
    object-fit: contain;
    display: block;
  }

  .lightbox-info {
    margin-top: 1rem;
    text-align: center;
    color: #e8e2d9;
    font-family: Georgia, serif;
    max-width: 600px;
  }

  .lightbox-info .lb-description {
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 0.4rem;
  }

  .lightbox-info .lb-notes {
    font-size: 0.8rem;
    color: rgba(232,226,217,0.55);
    font-style: italic;
  }

  .lightbox-close {
    position: fixed;
    top: 1.25rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .lightbox-close:hover { opacity: 1; }

  .lightbox-prev,
  .lightbox-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #fff;
    font-size: 3rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    padding: 0.5rem 1rem;
    line-height: 1;
  }

  .lightbox-prev { left: 0.5rem; }
  .lightbox-next { right: 0.5rem; }
  .lightbox-prev:hover,
  .lightbox-next:hover { opacity: 1; }

  @media (max-width: 600px) {
    .photo-grid { columns: 2 140px; }
    .lightbox { padding: 1rem; }
    .lightbox-prev { left: 0; }
    .lightbox-next { right: 0; }
  }
</style>

<script>
  const photos = JSON.parse(document.getElementById('photo-data').textContent);
  let current = 0;

  // Build grid
  const grid = document.getElementById('photo-grid');
  photos.forEach((photo, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.onclick = () => openLightbox(i);

    const img = document.createElement('img');
    img.src = photo.src;
    img.alt = photo.description || '';
    img.loading = 'lazy';
    item.appendChild(img);

    if (photo.description) {
      const hover = document.createElement('div');
      hover.className = 'photo-hover';
      hover.textContent = photo.description;
      item.appendChild(hover);
    }

    grid.appendChild(item);
  });

  function openLightbox(index) {
    current = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lightbox-close')) return;
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function shiftLightbox(dir, e) {
    if (e) e.stopPropagation();
    current = (current + dir + photos.length) % photos.length;
    updateLightbox();
  }

  function updateLightbox() {
    const photo = photos[current];
    document.getElementById('lightbox-img').src = photo.src;
    document.getElementById('lightbox-img').alt = photo.description || '';

    const info = document.getElementById('lightbox-info');
    info.innerHTML = '';
    if (photo.description) {
      const d = document.createElement('p');
      d.className = 'lb-description';
      d.textContent = photo.description;
      info.appendChild(d);
    }
    if (photo.notes) {
      const n = document.createElement('p');
      n.className = 'lb-notes';
      n.textContent = photo.notes;
      info.appendChild(n);
    }
  }

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowLeft') shiftLightbox(-1);
    if (e.key === 'ArrowRight') shiftLightbox(1);
    if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
  });
</script>
