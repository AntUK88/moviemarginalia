name: Import Letterboxd Review

on:
  workflow_dispatch:
    inputs:
      review_url:
        description: "Letterboxd review URL"
        required: true
        type: string
      review_date:
        description: "Original review date (YYYY-MM-DD, e.g. 2023-05-27). Leave blank to auto-detect."
        required: false
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run import script
        run: python3 scripts/import_review.py "${{ github.event.inputs.review_url }}" "${{ github.event.inputs.review_date }}"

      - name: Commit and push new review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _selected/
          git diff --staged --quiet || git commit -m "Import review: ${{ github.event.inputs.review_url }}"
          git push
