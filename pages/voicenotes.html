---
layout: default
title: Voice Notes
permalink: /voicenotes/
noindex: true
sitemap: false
---

<div class="vn-page">
  <h1 class="vn-heading">Voice Notes</h1>

  <div class="vn-controls">
    <input type="search" id="vn-search" class="vn-search" placeholder="Search by title…" autocomplete="off" aria-label="Search by film title">
    <div class="vn-sort-bar">
      <span class="vn-sort-label">Sort:</span>
      <button class="vn-sort-btn active" data-sort="date_added">Date added</button>
      <button class="vn-sort-btn" data-sort="title">A–Z</button>
      <button class="vn-sort-btn" data-sort="year">Year</button>
      <button class="vn-sort-btn" data-sort="duration_seconds">Duration</button>
    </div>
  </div>

  <div id="vn-count" class="vn-count"></div>
  <div id="vn-list" class="vn-list"></div>
  <div id="vn-pagination" class="vn-pagination"></div>
</div>

<!-- Fix match modal -->
<div id="vn-fix-modal" class="vn-modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="vn-fix-heading">
  <div class="vn-modal">
    <h2 class="vn-modal-heading" id="vn-fix-heading">Fix movie match</h2>
    <p class="vn-modal-slug">Slug: <code id="vn-fix-slug-display"></code></p>
    <p class="vn-modal-hint">Find the correct film on TMDb, copy its numeric ID from the URL, then paste it below.</p>
    <a id="vn-fix-tmdb-link" href="https://www.themoviedb.org/search" target="_blank" rel="noopener" class="vn-modal-tmdb-link">Search TMDb →</a>
    <div class="vn-modal-field">
      <label for="vn-fix-tmdb-id" class="vn-modal-label">TMDb movie ID</label>
      <input type="text" id="vn-fix-tmdb-id" class="vn-modal-input" placeholder="e.g. 12345" autocomplete="off">
    </div>
    <div class="vn-modal-cmd-wrap">
      <code id="vn-fix-cmd" class="vn-modal-cmd"></code>
    </div>
    <div class="vn-modal-actions">
      <button id="vn-fix-copy-btn" class="vn-modal-copy-btn">Copy command</button>
      <button id="vn-fix-close-btn" class="vn-modal-close-btn">Close</button>
    </div>
  </div>
</div>

<script>
var VN_ENTRIES = {{ site.data.audio_archive | jsonify }};
var VN_PAGE_SIZE = 30;
var vnQuery = '';
var vnSort = 'date_added';
var vnPage = 1;

function vnEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function vnFormatDuration(secs) {
  if (!secs) return '—';
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = Math.floor(secs % 60);
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return m + ':' + String(s).padStart(2,'0');
}

function vnFormatDate(str) {
  if (!str) return '—';
  var parts = str.split('-');
  var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function vnFormatFileSize(bytes) {
  if (!bytes) return null;
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function vnGetFiltered() {
  var q = vnQuery.trim().toLowerCase();
  if (!q) return VN_ENTRIES.slice();
  return VN_ENTRIES.filter(function(e) {
    return e.title.toLowerCase().indexOf(q) !== -1;
  });
}

function vnGetSorted(arr) {
  return arr.slice().sort(function(a, b) {
    if (vnSort === 'title') return a.title.localeCompare(b.title);
    if (vnSort === 'year') return (a.year || 0) - (b.year || 0);
    if (vnSort === 'duration_seconds') return (a.duration_seconds || 0) - (b.duration_seconds || 0);
    return (b.date_added || '').localeCompare(a.date_added || '');
  });
}

function vnRender() {
  var filtered = vnGetSorted(vnGetFiltered());
  var total = filtered.length;
  var totalPages = Math.max(1, Math.ceil(total / VN_PAGE_SIZE));
  if (vnPage > totalPages) vnPage = totalPages;
  var slice = filtered.slice((vnPage - 1) * VN_PAGE_SIZE, vnPage * VN_PAGE_SIZE);

  var countEl = document.getElementById('vn-count');
  countEl.textContent = total === VN_ENTRIES.length
    ? total + (total === 1 ? ' entry' : ' entries')
    : total + ' of ' + VN_ENTRIES.length + ' entries';

  var list = document.getElementById('vn-list');
  if (slice.length === 0) {
    list.innerHTML = '<p class="vn-empty">No entries found.</p>';
  } else {
    list.innerHTML = slice.map(function(e) {
      var posterHtml = e.poster
        ? '<img src="' + vnEsc(e.poster) + '" alt="' + vnEsc(e.title) + ' poster" loading="lazy" class="vn-poster-img">'
        : '<div class="vn-poster-placeholder"></div>';
      var meta = [];
      if (e.year) meta.push(e.year);
      if (e.director) meta.push(vnEsc(e.director));
      var encodedFilename = encodeURIComponent(e.filename);
      var sub = ['Added ' + vnFormatDate(e.date_added)];
      if (e.duration_seconds) sub.push(vnFormatDuration(e.duration_seconds));
      var fmtSize = vnFormatFileSize(e.file_size_bytes);
      if (fmtSize) sub.push(fmtSize);
      var totalLabel = vnFormatDuration(e.duration_seconds);
      return (
        '<div class="vn-entry">' +
          '<div class="vn-poster">' + posterHtml + '</div>' +
          '<div class="vn-info">' +
            '<div class="vn-meta">' + meta.join(' · ') + '</div>' +
            '<h2 class="vn-title">' + vnEsc(e.title) + '</h2>' +
            '<div class="vn-sub">' + sub.join(' · ') + '</div>' +
            '<div class="vn-player">' +
              '<audio preload="none" class="vn-audio-el" data-duration="' + (e.duration_seconds || 0) + '">' +
                '<source src="/audio/' + encodedFilename + '">' +
              '</audio>' +
              '<button class="vn-play-btn" aria-label="Play">&#9654;</button>' +
              '<div class="vn-progress-track">' +
                '<div class="vn-progress-fill"></div>' +
              '</div>' +
              '<span class="vn-time-display">0:00 / ' + totalLabel + '</span>' +
            '</div>' +
            '<div class="vn-action-row">' +
              '<a class="vn-download" href="/audio/' + encodedFilename + '" download="' + vnEsc(e.filename) + '">Download</a>' +
              '<button class="vn-fix-btn" data-slug="' + vnEsc(e.letterboxd_slug) + '" data-title="' + vnEsc(e.title) + '">Fix match</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  var pag = document.getElementById('vn-pagination');
  if (totalPages <= 1) {
    pag.innerHTML = '';
  } else {
    var prev = vnPage > 1
      ? '<button class="vn-page-btn" onclick="vnGoPage(' + (vnPage - 1) + ')">← Previous</button>'
      : '<button class="vn-page-btn" disabled>← Previous</button>';
    var next = vnPage < totalPages
      ? '<button class="vn-page-btn" onclick="vnGoPage(' + (vnPage + 1) + ')">Next →</button>'
      : '<button class="vn-page-btn" disabled>Next →</button>';
    pag.innerHTML = prev + '<span class="vn-page-info">' + vnPage + ' / ' + totalPages + '</span>' + next;
  }

  vnInitPlayers();
}

function vnInitPlayers() {
  document.querySelectorAll('.vn-audio-el').forEach(function(audio) {
    var player = audio.closest('.vn-player');
    var playBtn = player.querySelector('.vn-play-btn');
    var fill = player.querySelector('.vn-progress-fill');
    var track = player.querySelector('.vn-progress-track');
    var timeEl = player.querySelector('.vn-time-display');
    var totalSecs = parseInt(audio.dataset.duration, 10) || 0;
    var totalLabel = vnFormatDuration(totalSecs);

    playBtn.addEventListener('click', function() {
      if (audio.paused) {
        document.querySelectorAll('.vn-audio-el').forEach(function(a) {
          if (a !== audio && !a.paused) {
            a.pause();
            a.closest('.vn-player').querySelector('.vn-play-btn').innerHTML = '&#9654;';
          }
        });
        audio.play();
        playBtn.innerHTML = '&#10074;&#10074;';
      } else {
        audio.pause();
        playBtn.innerHTML = '&#9654;';
      }
    });

    audio.addEventListener('timeupdate', function() {
      var pct = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
      fill.style.width = pct + '%';
      timeEl.textContent = vnFormatDuration(Math.floor(audio.currentTime)) + ' / ' + totalLabel;
    });

    audio.addEventListener('ended', function() {
      playBtn.innerHTML = '&#9654;';
      fill.style.width = '0%';
      timeEl.textContent = '0:00 / ' + totalLabel;
    });

    track.addEventListener('click', function(ev) {
      var rect = track.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      var seek = function() { audio.currentTime = pct * audio.duration; };
      if (audio.readyState >= 1) {
        seek();
      } else {
        audio.addEventListener('loadedmetadata', seek, { once: true });
        audio.load();
      }
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '&#10074;&#10074;';
      }
    });
  });
}

function vnGoPage(n) {
  vnPage = n;
  vnRender();
  document.getElementById('vn-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('vn-search').addEventListener('input', function() {
  vnQuery = this.value;
  vnPage = 1;
  vnRender();
});

document.querySelectorAll('.vn-sort-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    vnSort = this.dataset.sort;
    document.querySelectorAll('.vn-sort-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    vnPage = 1;
    vnRender();
  });
});

// Fix match modal
var vnFixSlug = '';

document.addEventListener('click', function(ev) {
  var btn = ev.target.closest('.vn-fix-btn');
  if (!btn) return;
  vnFixSlug = btn.dataset.slug;
  var title = btn.dataset.title;
  document.getElementById('vn-fix-slug-display').textContent = vnFixSlug;
  document.getElementById('vn-fix-tmdb-link').href =
    'https://www.themoviedb.org/search?query=' + encodeURIComponent(title);
  document.getElementById('vn-fix-tmdb-id').value = '';
  vnUpdateFixCmd('');
  document.getElementById('vn-fix-modal').style.display = 'flex';
  setTimeout(function() { document.getElementById('vn-fix-tmdb-id').focus(); }, 50);
});

document.getElementById('vn-fix-close-btn').addEventListener('click', function() {
  document.getElementById('vn-fix-modal').style.display = 'none';
});

document.getElementById('vn-fix-modal').addEventListener('click', function(ev) {
  if (ev.target === this) this.style.display = 'none';
});

document.addEventListener('keydown', function(ev) {
  if (ev.key === 'Escape') document.getElementById('vn-fix-modal').style.display = 'none';
});

function vnUpdateFixCmd(tmdbId) {
  var id = tmdbId || '<tmdb-id>';
  document.getElementById('vn-fix-cmd').textContent =
    'python3 scripts/update_audio_archive.py --reprocess ' + vnFixSlug + ' ' + id;
}

document.getElementById('vn-fix-tmdb-id').addEventListener('input', function() {
  vnUpdateFixCmd(this.value.trim());
});

document.getElementById('vn-fix-copy-btn').addEventListener('click', function() {
  var cmd = document.getElementById('vn-fix-cmd').textContent;
  if (cmd.indexOf('<tmdb-id>') !== -1) return;
  var self = this;
  navigator.clipboard.writeText(cmd).then(function() {
    self.textContent = 'Copied!';
    setTimeout(function() { self.textContent = 'Copy command'; }, 1500);
  });
});

vnRender();
</script>
