name: Update Audio Archive

on:
  push:
    branches: [gh-pages]
    paths:
      - "audio/**"
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to reprocess (leave blank for normal scan)'
        required: false
        default: ''
      tmdb_id:
        description: 'TMDb movie ID for reprocess'
        required: false
        default: ''

jobs:
  update-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests mutagen

      - name: Update audio archive
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "${{ inputs.slug }}" ] && [ -n "${{ inputs.tmdb_id }}" ]; then
            python3 scripts/update_audio_archive.py --reprocess "${{ inputs.slug }}" "${{ inputs.tmdb_id }}"
          else
            python3 scripts/update_audio_archive.py
          fi

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/audio_archive.json
          git diff --staged --quiet || git commit -m "chore: update audio archive [skip ci]"
          git push
