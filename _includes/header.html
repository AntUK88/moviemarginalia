<style>
  .site-header {
    background: #fff7ed;
    padding: 1rem 2rem;
    border-bottom: 1px solid #e5e0d8;
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: Georgia, "Times New Roman", serif;
  }

  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  .nav-left {
    display: flex;
    align-items: center;
  }

  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none !important;
    color: #000;
    font-weight: 700;
    font-size: 1.1rem;
    font-family: Georgia, "Times New Roman", serif;
    gap: 0.4rem;
  }

  .logo-img {
    height: 26px;
    width: auto;
    object-fit: contain;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .menu-links,
  .social-icons {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    font-family: Georgia, "Times New Roman", serif;
  }

  .menu-link {
    text-decoration: none !important;
    color: #000;
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .menu-link:hover { color: #555; }

  .social-icons a {
    color: #000;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    text-decoration: none !important;
  }

  .social-icons a:hover { color: #555; }

  /* Hamburger — hidden on desktop */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #000;
    padding: 0.25rem 0.5rem;
    margin-left: auto; /* pushes it to the far right */
  }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    .site-header {
      padding: 0.75rem 1.25rem;
    }

    .site-nav {
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-toggle {
      display: block;
    }

    /* Dropdown fills full width below the logo/hamburger row */
    .nav-right {
      display: none;
      flex-direction: column;
      align-items: flex-start; /* text left-aligned */
      gap: 1rem;
      width: 100%;
      padding: 1rem 0 0.5rem 0;
      border-top: 1px solid #e5e0d8;
      margin-top: 0.5rem;
    }

    .nav-right.open {
      display: flex;
    }

    .menu-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      width: 100%;
    }

    .social-icons {
      gap: 1.25rem;
    }
  }
</style>

<script>
  function toggleMenu() {
    var nav = document.getElementById('nav-right');
    nav.classList.toggle('open');
  }
</script>
