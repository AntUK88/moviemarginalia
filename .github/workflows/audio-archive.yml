name: Update Audio Archive

on:
  push:
    branches: [main]
    paths:
      - "audio/**"

jobs:
  update-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests mutagen

      - name: Update audio archive
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/update_audio_archive.py

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/audio_archive.json
          git diff --staged --quiet || git commit -m "chore: update audio archive [skip ci]"
          git push
