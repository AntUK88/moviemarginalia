<header class="site-header">
  <nav class="site-nav">
    <a href="/" class="site-name">Movie Marginalia</a>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">&#9776;</button>
    <div class="nav-right" id="nav-right">
      <ul class="menu-links">
        <li><a href="https://moviemarginalia.substack.com" target="_blank" rel="noopener noreferrer">Writing</a></li>
        <li><a href="/selected">Selected Pieces</a></li>
        <li><a href="/bio">Bio</a></li>
      </ul>
      <ul class="social-icons">
        <li><a href="https://www.instagram.com/moviemarginalia" target="_blank" aria-label="Instagram"><i class="fa fa-instagram"></i></a></li>
        <li><a href="https://boxd.it/1yzWH" target="_blank" aria-label="Letterboxd"><i class="fa fa-film"></i></a></li>
        <li><a href="https://youtube.com/@moviemarginalia" target="_blank" aria-label="YouTube"><i class="fa fa-youtube-play"></i></a></li>
        <li><a href="mailto:moviemarginalia@gmail.com" aria-label="Email"><i class="fa fa-envelope"></i></a></li>
      </ul>
    </div>
  </nav>
</header>
<style>
  :root {
    --ink: #1a1814;
    --muted: #8a8478;
    --rule: #d8d2c8;
    --cream: #fff7ed;
  }
  .site-header {
    background: var(--cream);
    height: 56px;
    padding: 0 2.5rem;
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
    width: 100%;
    box-shadow: none;
  }
  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }
  .site-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-decoration: none;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .menu-links,
  .social-icons {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .menu-links a {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .menu-links a:hover { color: var(--ink); }
  .social-icons a {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    text-decoration: none;
    transition: color 0.2s;
  }
  .social-icons a:hover { color: var(--ink); }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 1.25rem;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    flex-shrink: 0;
  }
  @media (max-width: 680px) {
    .site-header {
      height: 48px;
      padding: 0 1.25rem;
    }
    .site-nav {
      flex-wrap: wrap;
      height: auto;
      padding: 0.75rem 0;
    }
    .site-name {
      flex: 1;
    }
    .nav-toggle {
      display: block;
    }
    .nav-right {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      width: 100%;
      padding: 1rem 0 0.5rem;
      border-top: 1px solid var(--rule);
      margin-top: 0.5rem;
    }
    .nav-right.open {
      display: flex;
    }
    .menu-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .social-icons {
      gap: 1.25rem;
    }
  }
</style>
<script>
  function toggleMenu() {
    document.getElementById('nav-right').classList.toggle('open');
  }
</script>
