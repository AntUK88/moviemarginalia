<div class="carousel-wrapper">
  <div class="carousel" id="carousel">
    <div class="carousel-item active"><img src="/assets/img/Edinburgh/Picture1.jpg" alt="Description of photo 1">
    <img src="/assets/img/Edinburgh/Picture2.jpg" alt="Description of photo 2">
    <img src="/assets/img/Edinburgh/Picture3.jpg" alt="Description of photo 3">
    <img src="/assets/img/Edinburgh/Picture4.jpg" alt="Description of photo 4">
    <img src="/assets/img/Edinburgh/Picture5.jpg" alt="Description of photo 5">
  </div>
  <div class="carousel-buttons">
    <button onclick="rotateCarousel(-1)">‹</button>
    <button onclick="rotateCarousel(1)">›</button>
  </div>
</div>

<style>
  .carousel-wrapper {
    max-width: 900px;
    margin: 3rem auto;
    text-align: center;
  }

  .carousel {
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    overflow: hidden;
    position: relative;
  }

  .carousel-item {
    flex: 0 0 60%;
    opacity: 0.4;
    transition: transform 0.6s ease, opacity 0.6s ease;
    transform: scale(0.8);
    z-index: 1;
  }

  .carousel-item img {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
  }

  .carousel-item.active {
    opacity: 1;
    transform: scale(1);
    z-index: 10;
  }

  .carousel-buttons {
    margin-top: 1rem;
  }

  .carousel-buttons button {
    font-size: 2rem;
    padding: 0.5rem 1rem;
    margin: 0 1rem;
    background-color: #eee;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .carousel-buttons button:hover {
    background-color: #ddd;
  }
</style>

<script>
  const items = document.querySelectorAll('.carousel-item');
  let current = 0;

  function updateCarousel() {
    items.forEach((item, index) => {
      item.classList.remove('active');
      item.style.transform = 'scale(0.8)';
      item.style.opacity = '0.4';
      item.style.zIndex = '1';
    });

    items[current].classList.add('active');
    items[current].style.transform = 'scale(1)';
    items[current].style.opacity = '1';
    items[current].style.zIndex = '10';
  }

  function rotateCarousel(direction) {
    current = (current + direction + items.length) % items.length;
    updateCarousel();
  }

  updateCarousel();
</script>
