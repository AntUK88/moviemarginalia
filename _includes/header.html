<style>
  :root {
    --ink: #1a1814;
    --muted: #8a8478;
    --rule: #d8d2c8;
    --cream: #fff7ed;
  }
  .site-header {
    background: var(--cream);
    height: 56px;
    padding: 0 2.5rem;
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
    width: 100%;
    box-shadow: none;
  }
  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    width: 100%;
  }
  .site-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    line-height: 1;
  }
  .site-logo {
    height: 28px;
    width: auto;
    display: block;
    margin: 0;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding-top: 10px;
  }
  .menu-links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .menu-links a {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    line-height: 1;
  }
  .menu-links a:hover { color: var(--ink); }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 1.25rem;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    flex-shrink: 0;
  }
  @media (max-width: 680px) {
    .site-header {
      height: auto;
      min-height: 48px;
      padding: 0 1.25rem 0 0;
    }
    .site-nav {
      flex-wrap: wrap;
      height: auto;
      padding: 0.75rem 0;
    }
    .site-name {
      flex: 1;
      gap: 0;
    }
    .nav-toggle {
      display: block;
    }
    .nav-right {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      width: 100%;
      padding: 1rem 0 0.5rem 1.25rem;
      border-top: 1px solid var(--rule);
      margin-top: 0.5rem;
    }
    .nav-right.open {
      display: flex;
    }
    .menu-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }
  }
</style>
<script>
  function toggleMenu() {
    document.getElementById('nav-right').classList.toggle('open');
  }
</script>
