<head>
  <title>
    {% if page.title == "" or page.title == nil %}
      {{ site.title }} | {{ site.description }}
    {% else %}
      {{ page.title }} | {{ site.title }}
    {% endif %}
  </title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon">

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/syntax.css">
  <link rel="stylesheet" href="/theme.css">
  <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>

  <!-- RSS Feed -->
  {% feed_meta %}

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- Google Analytics -->
  {% include google-analytics.html %}

  <!-- SEO plugin -->
  {% seo %}

  <style>
    html, body {
      background-color: var(--cream, #fff7ed);
      font-family: 'EB Garamond', Georgia, serif;
      color: var(--ink, #1a1814);
      margin: 0;
      padding: 0;
    }
  </style>
</head>
