<style>
  .carousel-wrapper {
    max-width: 800px;
    margin: 0 auto 2rem auto;
  }

  .carousel-stage {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .carousel-track {
    flex: 1;
    position: relative;
    /* height driven by the image itself */
    min-height: 200px;
  }

  .carousel-item {
    display: none;
  }

  .carousel-item.active {
    display: block;
  }

  .carousel-item img {
    width: 100%;
    height: auto;
    max-height: 520px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .carousel-btn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 2.2rem;
    line-height: 1;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    color: #333;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .carousel-btn:hover {
    background: #ede8df;
  }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .carousel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s;
  }

  .carousel-dot.active {
    background: #555;
  }

  .carousel-caption {
    text-align: center;
    font-style: italic;
    font-family: Georgia, serif;
    font-size: 0.875rem;
    color: #666;
    margin-top: 0.6rem;
  }

  /* Mobile: buttons move below, stack vertically */
  @media (max-width: 500px) {
    .carousel-stage {
      flex-direction: column;
    }
    .carousel-btn {
      display: none;
    }
    /* On mobile, swipe left/right — handled by touch events below */
  }
</style>

<script>
  const items = Array.from(document.querySelectorAll('.carousel-item'));
  const dotsContainer = document.getElementById('carousel-dots');
  let current = 0;

  // Build dots
  items.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Go to photo ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
  });

  function goTo(index) {
    items[current].classList.remove('active');
    dotsContainer.children[current].classList.remove('active');
    current = (index + items.length) % items.length;
    items[current].classList.add('active');
    dotsContainer.children[current].classList.add('active');
  }

  function rotateCarousel(direction) {
    goTo(current + direction);
  }

  // Touch/swipe support for mobile
  const track = document.getElementById('carousel-track');
  let touchStartX = 0;
  track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  track.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) rotateCarousel(diff > 0 ? 1 : -1);
  }, { passive: true });
</script>
