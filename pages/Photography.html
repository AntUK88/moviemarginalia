<div class="carousel-wrapper">
  <div class="carousel" id="carousel">
    <div class="carousel-item"><img src="/assets/img/Edinburgh/Picture1.jpg" alt="Photo 1"></div>
    <div class="carousel-item"><img src="/assets/img/Edinburgh/Picture2.jpg" alt="Photo 2"></div>
    <div class="carousel-item"><img src="/assets/img/Edinburgh/Picture3.jpg" alt="Photo 3"></div>
    <div class="carousel-item"><img src="/assets/img/Edinburgh/Picture4.jpg" alt="Photo 4"></div>
    <div class="carousel-item"><img src="/assets/img/Edinburgh/Picture5.jpg" alt="Photo 5"></div>
  </div>

  <p class="photo-caption">
    Taken on Olympus OM-10 35mm. Colour film is Fujifilm Fujicolor C200; B&W is Foma Fomapan 400 ISO.
  </p>

  <div class="carousel-buttons">
    <button onclick="rotateCarousel(-1)">‹</button>
    <button onclick="rotateCarousel(1)">›</button>
  </div>
</div>

<style>
  .carousel-wrapper {
  max-width: 1200px;
  margin: 2rem auto 1rem auto; /* Less top + bottom space */
  text-align: center;
}

  .carousel {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    height: 500px;
  }

  .carousel-item {
    flex: 0 0 80%;
    opacity: 0.4;
    transform: scale(0.8);
    transition: transform 0.5s ease, opacity 0.5s ease;
    position: absolute;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    z-index: 1;
    pointer-events: none;
  }

  .carousel-item.active {
    opacity: 1;
    transform: translateX(-50%) scale(2); /* DOUBLE SIZE */
    z-index: 10;
    pointer-events: auto;
  }

  .carousel-item img {
    width: 100%;
    border-radius: 0;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    max-height: 100%;
    object-fit: contain;
  }

  .photo-caption {
  margin: 0.75rem auto 0.25rem auto; /* Top/bottom spacing reduced */
  font-style: italic;
  max-width: 700px;
  line-height: 1.4;
  color: #444;
}

  .carousel-buttons {
  margin-top: 0.5rem; /* Previously 1rem */
}

  .carousel-buttons button {
    font-size: 2rem;
    padding: 0.5rem 1.2rem;
    margin: 0 1rem;
    background-color: #eee;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .carousel-buttons button:hover {
    background-color: #ddd;
  }
</style>

<script>
  const items = document.querySelectorAll('.carousel-item');
  let current = 0;

  function updateCarousel() {
    items.forEach((item, index) => {
      item.classList.remove('active');
    });
    items[current].classList.add('active');
  }

  function rotateCarousel(direction) {
    current = (current + direction + items.length) % items.length;
    updateCarousel();
  }

  updateCarousel();
</script>
